# See gistx.properties for what this file is and how it's used.
productId=datakollecta
applicationId=com.datakollecta.datakollecta
appLabel=DataKollecta
archivesBaseName=datakollecta
keystoreProperties=key-datakollecta.properties
#
# TEMPORARY: DataKollecta's own launcher icon art is not finalized yet (see
# assets/branding/datakollecta.png), so this currently points at GiSTX's
# icon directory rather than a dedicated one -- both apps show the same
# launcher icon for now. Once real art exists, add
# android/app/src/main/res-datakollecta/mipmap-*/launcher_icon.png and
# change this to iconResDir=src/main/res-datakollecta. Unlike applicationId
# or the storage folder, the launcher icon carries no on-device data risk,
# so this is safe to change at any time.
iconResDir=src/main/res
