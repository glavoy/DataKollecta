# See gistx.properties for what this file is and how it's used.
productId=datakollecta
applicationId=com.datakollecta.datakollecta
appLabel=DataKollecta
archivesBaseName=datakollecta
keystoreProperties=key-datakollecta.properties
#
# android/app/src/main/res-datakollecta/mipmap-*/launcher_icon.png holds
# DataKollecta's own launcher icon, generated from
# assets/branding/datakollecta_icon.png via
# `dart run flutter_launcher_icons:main -f tool/product/android/flutter_launcher_icons_datakollecta.yaml`
# -- rerun that if the art ever changes. src/main/res deliberately carries
# no mipmap-*/launcher_icon.png of its own: both this directory and GiSTX's
# (src/main/res-gistx) are added to the same Android sourceSet
# (build.gradle.kts), and having the same resource defined in two of that
# sourceSet's directories is a hard Gradle "Duplicate resources" build
# error, not an override -- confirmed directly, not assumed. Unlike
# applicationId or the storage folder, the launcher icon carries no
# on-device data risk, so it's safe to change at any time.
iconResDir=src/main/res-datakollecta
