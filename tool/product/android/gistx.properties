# Copied to android/product.properties by tool/build.dart before every
# Android build (see _applyProductConfigs). Do not hand-edit
# android/product.properties directly -- edit this template instead.
#
# android/product.properties' own committed content is always this file's
# content, so a fresh checkout or a crashed build leaves the tree buildable
# without running the tool first.
productId=gistx
applicationId=com.gistx.gistx
appLabel=GiSTX
archivesBaseName=gistx
keystoreProperties=key.properties
#
# GiSTX's launcher icon lives in its own directory (not src/main/res) so it
# can coexist with DataKollecta's -- see datakollecta.properties for why.
iconResDir=src/main/res-gistx
